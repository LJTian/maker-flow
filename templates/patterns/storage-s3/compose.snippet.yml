# docker-compose snippet for local MinIO S3-compatible storage in dev mode
services:
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: app-local-s3
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - s3_data:/data

volumes:
  s3_data:
