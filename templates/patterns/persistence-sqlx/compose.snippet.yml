# Merge into product docker-compose.yml (pick one DB shape).

services:
  api:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      SQLITE_PATH: ${SQLITE_PATH:-/data/app.db}
    volumes:
      # sqlite only:
      - ./data:/data
    # depends_on:
    #   - db
    restart: unless-stopped

